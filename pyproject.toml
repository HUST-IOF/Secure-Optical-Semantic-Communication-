[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-optical-semantic-communication"
version = "0.1.0"
description = "Reconfigurable fiber response coding and direct semantic recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
authors = [
  {name = "Jixing Ren"}, {name = "Xuchen Hua"},
  {name = "Hao Wu", email = "wuhaoboom@hust.edu.cn"},
  {name = "Ming Tang", email = "tangming@mail.hust.edu.cn"}
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
attack = ["torch>=2.2,<3"]
gpu = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
